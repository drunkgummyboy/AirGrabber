# Every release goes to the `candidate` branch first: users' copies only ever read `main`, so a red run
# here stops a bad version before anyone gets it (the release steps are in CLAUDE.md).
name: Tests

on:
  push:
    branches: [main, candidate]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # The runner's screen is 1024x768 and Tk keeps a window within the screen: the window tests
      # need the room a real PC has. Stops here, in seconds, if the screen can't be changed.
      - name: Use a bigger screen
        shell: powershell
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "Screen: $($screen.Width) x $($screen.Height)"
          if ($screen.Width -lt 1920) { throw "The screen is still too small" }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install packages
        run: python -m pip install -r requirements.txt mypy
      - name: Check the types
        run: python -m mypy
      # What failed also goes in the run's summary (annotations), which needs no sign-in to read.
      - name: Run the tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -t . 2>&1 | Tee-Object -FilePath tests.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path tests.log -Pattern '^(FAIL|ERROR): |^[A-Za-z_.]*Error: ' |
              Select-Object -First 9 |
              ForEach-Object { $line = $_.Line; "::error::$($line.Substring(0, [Math]::Min(180, $line.Length)))" }
          }
          exit $code
